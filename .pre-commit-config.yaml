# Pre-commit hooks for code quality and security
# Install: pre-commit install
# Run manually: pre-commit run --all-files
# Update hooks: pre-commit autoupdate
#
# Evidence: Pre-commit ensures consistent code quality before commits
# Source: https://pre-commit.com/
# Verified: 2025-11-14

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # File format checks
      - id: trailing-whitespace
        name: Trim trailing whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        name: Fix end of files (ensure newline at EOF)
      - id: check-yaml
        name: Check YAML syntax

      - id: check-toml
        name: Check TOML syntax
      - id: check-json
        name: Check JSON syntax
      - id: check-added-large-files
        name: Check for large files (>500KB)
        args: [--maxkb=500]

      # Git checks
      - id: check-merge-conflict
        name: Check for merge conflict markers
      - id: check-case-conflict
        name: Check for files with case-insensitive name conflicts
      - id: check-docstring-first
        name: Check docstring is first in Python files

      # Security checks
      - id: detect-private-key
        name: Detect private keys
      - id: check-ast
        name: Check Python syntax (AST)

      # Code quality
      - id: mixed-line-ending
        name: Fix mixed line endings
        args: [--fix=lf]
      - id: name-tests-test
        name: Ensure tests are named test_*.py
        args: [--pytest-test-first]
        exclude: ^tests/(fixtures|conftest\.py)

  # Ruff - Fast Python linter and formatter (replaces black, isort, flake8)
  # Evidence: Ruff is 10-100x faster than traditional Python linters
  # Source: https://docs.astral.sh/ruff/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      # Linting
      - id: ruff
        name: Ruff linter
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi, jupyter]

      # Formatting
      - id: ruff-format
        name: Ruff formatter
        types_or: [python, pyi, jupyter]

  # mypy - Static type checker
  # Evidence: Static type checking catches bugs before runtime
  # Source: https://mypy.readthedocs.io/
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        name: mypy type checker
        args:
          [
            --ignore-missing-imports,
            --allow-untyped-decorators,
            --no-warn-return-any,
          ]
        additional_dependencies:
          - types-requests
          - types-redis
          - pydantic
          - sqlalchemy
          - fastapi
          - pydantic-settings
        exclude: ^(tests/|scripts/|src/tasks/|src/mcp/|src/services/)

  # Bandit - Security linter for Python
  # Evidence: Bandit detects common security issues in Python code
  # Source: https://bandit.readthedocs.io/
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        name: Bandit security scanner
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^tests/

  # Poetry - Dependency management validation
  # Evidence: Ensures pyproject.toml and poetry.lock are in sync
  # Source: https://python-poetry.org/docs/pre-commit-hooks/
  # Version: 2.2.1 (Updated to match local/Docker/CI environment - 2025-11-14)
  - repo: https://github.com/python-poetry/poetry
    rev: 2.2.1
    hooks:
      - id: poetry-check
        name: Poetry validation
        args: [--lock]
      - id: poetry-lock
        name: Poetry lock file validation

  # Prettier - Format YAML, JSON, Markdown
  # Evidence: Consistent formatting for non-Python files
  # Source: https://prettier.io/
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        name: Prettier formatter
        types_or: [yaml, markdown, json]
        exclude: ^(poetry\.lock|\.vscode/|\.github/)

  # Dockerfile linting
  # Evidence: Dockerfile best practices enforcement
  # Source: https://github.com/hadolint/hadolint
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        name: Dockerfile linter
        args:
          [
            --ignore,
            DL3008,
            --ignore,
            DL3013,
            --ignore,
            DL3015,
            --ignore,
            DL3059,
            --ignore,
            SC2028,
          ]

  # Shell script linting
  # Evidence: Shell script best practices and bug detection
  # Source: https://www.shellcheck.net/
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        name: Shell script linter
        args: [--severity=warning]

# Configuration
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

# Fail fast: stop on first failure
fail_fast: false

# Minimum pre-commit version
minimum_pre_commit_version: "3.0.0"
